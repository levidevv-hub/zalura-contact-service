server:
  port: ${PORT:8082}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/contacts}
    username: ${DB_USER:contacts}
    password: ${DB_PASSWORD:contacts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true


api:
  auth:
    issuer: ${API_AUTH_ISSUER:http://localhost:8085}
    jwks-uri: ${API_AUTH_JWKS_URI:http://localhost:8085/.well-known/jwks.json}
    audience: zalura-contact
worker:
  auth:
    token: ${CONTACT_WORKER_TOKEN:}
    companies: ${CONTACT_WORKER_COMPANIES:}
